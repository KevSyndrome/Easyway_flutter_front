name: easyway
description: "EasyWay - App para reportar baches en la ciudad"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.3

dependencies:
  flutter:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.8
  google_fonts: ^6.1.0
  
  # State Management - Riverpod
  flutter_riverpod: ^2.4.9
  
  # HTTP & WebSocket
  http: ^1.1.2
  web_socket_channel: ^2.4.0
  
  # Local Storage
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^11.2.0
  
  # Utils
  flutter_dotenv: ^5.1.0
  geolocator: ^10.1.0
  image_picker: ^1.0.7
  cached_network_image: ^3.3.1
  intl: ^0.19.0
  equatable: ^2.0.5
  
  # Mapas
  flutter_map: ^6.1.0
  latlong2: ^0.9.0
  mapbox_maps_flutter: ^2.20.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/icons/
    - .env
